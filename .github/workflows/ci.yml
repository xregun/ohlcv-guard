name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pandas: ["latest"]
        include:
          - { os: ubuntu-latest, python: "3.10", pandas: "2.1.*", numpy: "1.26.*" }
          - { os: ubuntu-latest, python: "3.12", pandas: "2.2.*", numpy: "2.0.*" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install -e .[dev]
          if [ "${{ matrix.pandas }}" != "latest" ]; then python -m pip install "pandas==${{ matrix.pandas }}" "numpy==${{ matrix.numpy }}"; fi
      - run: python -m pytest --cov

  # Type stubs differ across pandas / NumPy versions, so lint and types run once, on pinned tool versions.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install "pandas==3.0.6" "numpy==2.5.3" "pandas-stubs==3.1.0.261029" "mypy==2.4.1" "ruff==0.17.5"
      - run: python -m ruff check src tests
      - run: python -m mypy
